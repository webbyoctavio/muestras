name: fotos-tmp
on:
  push:
    branches: [fotos-tmp]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fotos-tmp
      - name: Buscar y descargar
        run: |
          python3 -m pip install -q --break-system-packages pillow || sudo apt-get install -y python3-pil
          python3 -m pip install -q --break-system-packages pillow || true
          python3 .github/scripts/full.py
          find tmp-fotos -type f | wc -l
          du -sh tmp-fotos
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add tmp-fotos
          git commit -q -m "Fotos descargadas" || echo "nada nuevo"
          git push origin HEAD:fotos-tmp
