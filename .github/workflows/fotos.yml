name: fotos-tmp
on:
  push:
    branches: [fotos-tmp]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fotos-tmp
      - name: Buscar y descargar miniaturas
        run: |
          set +e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          mkdir -p tmp-fotos/meta tmp-fotos/thumbs tmp-fotos/full
          if [ -f queries.txt ]; then
            while IFS='|' read -r key q; do
              [ -z "$key" ] && continue
              f="tmp-fotos/meta/$key.json"
              if [ ! -s "$f" ]; then
                curl -sS -A "$UA" -H "Accept: application/json" --max-time 30 -G "https://unsplash.com/napi/search/photos" --data-urlencode "query=$q" --data-urlencode "per_page=30" -o "$f"
                echo "$key: $(jq '.results|length' "$f" 2>/dev/null) resultados ($(head -c 120 "$f" | tr -d '\n'))"
                sleep 1
              fi
              mkdir -p "tmp-fotos/thumbs/$key"
              jq -r '.results[]? | select((.premium // false) == false and (.plus // false) == false) | .id + " " + .urls.small' "$f" 2>/dev/null | while read -r id url; do
                [ -s "tmp-fotos/thumbs/$key/$id.jpg" ] || curl -sSL -A "$UA" --max-time 40 -o "tmp-fotos/thumbs/$key/$id.jpg" "$url"
              done
            done < queries.txt
          fi
          if [ -f full.txt ]; then
            while IFS=' ' read -r name url; do
              [ -z "$name" ] && continue
              [ -s "tmp-fotos/full/$name.jpg" ] || curl -sSL -A "$UA" --retry 2 --max-time 60 -o "tmp-fotos/full/$name.jpg" "$url"
            done < full.txt
          fi
          find tmp-fotos -type f | wc -l
          du -sh tmp-fotos
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add tmp-fotos
          git commit -q -m "Fotos descargadas" || echo "nada nuevo"
          git push origin HEAD:fotos-tmp
